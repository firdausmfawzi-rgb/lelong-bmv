<title>Blacklist/Subsales Control Room</title>
<meta name="description" content="Rumah highrise below market value: nilai pasaran dari senarai lelong, dibandingkan dengan iklan subsales owner dan ejen. Laman peribadi Firdaus Jay.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M14 46V22l18-10 18 10v24H38V34H26v12z' fill='%23f59e0b'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#0f172a;--mute:#5b6473;--line:#e3e6eb;--brand:#0f172a;--gold:#b45309;--gold-bg:#fff7e6;--green:#15803d;--green-bg:#ecfdf3;--red:#b91c1c;--red-bg:#fef2f2;--blue:#1d4ed8;--blue-bg:#eff6ff;--chip:#eef1f5;--sh:0 1px 2px rgba(15,23,42,.06),0 6px 20px -12px rgba(15,23,42,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141a2c;--ink:#e8ecf4;--mute:#9aa4b8;--line:#263049;--brand:#e8ecf4;--gold:#fbbf24;--gold-bg:#2a2008;--green:#4ade80;--green-bg:#0c2a18;--red:#f87171;--red-bg:#2e1111;--blue:#93c5fd;--blue-bg:#0f1f3d;--chip:#1e2740;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141a2c;--ink:#e8ecf4;--mute:#9aa4b8;--line:#263049;--brand:#e8ecf4;--gold:#fbbf24;--gold-bg:#2a2008;--green:#4ade80;--green-bg:#0c2a18;--red:#f87171;--red-bg:#2e1111;--blue:#93c5fd;--blue-bg:#0f1f3d;--chip:#1e2740;--sh:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
a{color:var(--blue)}button{font:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:8px;min-height:56px;padding-top:6px;padding-bottom:6px}
h1{font-size:17px;margin:0;line-height:1.2}h1 small{display:block;font-size:11px;color:var(--mute);font-weight:500}
.ic{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.ic:hover{background:var(--chip)}
.grow{flex:1}
/* gate */
#gate{max-width:420px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:var(--sh)}
#gate h2{margin:0 0 4px;font-size:20px}#gate p{color:var(--mute);margin:0 0 16px;font-size:14px}
#code{width:100%;font-size:20px;letter-spacing:.14em;text-transform:uppercase;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--brand);color:var(--bg)}
.btn.w{width:100%;margin-top:12px}.btn.s{padding:7px 12px;font-size:13px;border-radius:10px}.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.g{background:var(--green);color:#fff}.btn.r{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.5;cursor:default}
#gmsg{min-height:20px;font-size:13px;color:var(--red);margin-top:10px;text-align:center}
/* tabs + stats */
.tabs{display:flex;gap:6px;margin:14px 0 10px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.tab.on{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.st b{display:block;font-size:20px;line-height:1.1}.st span{font-size:12px;color:var(--mute)}
/* filters */
.filters{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.filters label{font-size:11px;color:var(--mute);display:block;margin-bottom:2px}
.filters select,.filters input{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.filters .full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{font-size:12px;color:var(--mute)}
/* cards */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;cursor:pointer}
.card .ph{aspect-ratio:2/1;background:linear-gradient(135deg,#1e293b,#334155);position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph .nf{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:12px}
.card .ph .tag{position:absolute;left:10px;top:10px;background:rgba(15,23,42,.85);color:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:600}
.card .ph .lead{position:absolute;right:10px;top:10px;background:var(--green);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.card h3{margin:0;font-size:16px;line-height:1.25}.card .sub{font-size:12px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--chip);border-radius:7px;padding:2px 7px;font-size:11.5px;color:var(--ink)}
.chip.g{background:var(--gold-bg);color:var(--gold)}.chip.gr{background:var(--green-bg);color:var(--green)}.chip.r{background:var(--red-bg);color:var(--red)}.chip.b{background:var(--blue-bg);color:var(--blue)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.kv div span{display:block;font-size:11px;color:var(--mute)}
.kv b{font-weight:600}
.money{font-variant-numeric:tabular-nums}
.gap{font-weight:700}.gap.pos{color:var(--green)}.gap.neg{color:var(--red)}
.card .ft{display:flex;gap:6px;margin-top:auto;padding-top:4px}
/* cashback box */
.cash{grid-column:1/-1;border-radius:12px;padding:10px 12px;background:var(--green-bg);border:1px solid var(--green);font-size:13px}
.cash.no{background:var(--red-bg);border-color:var(--red)}.cash.na{background:var(--chip);border-color:var(--line)}
.cash h5{margin:0 0 6px;font-size:13px}
.cash .ln{display:flex;justify-content:space-between;gap:10px;padding:2px 0}.cash .ln span{color:var(--mute)}
.cash .tot{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;font-size:16px;font-weight:800}
.cash.no .tot{color:var(--red)}.cash:not(.no):not(.na) .tot{color:var(--green)}
.cash .how{font-size:11.5px;color:var(--mute);margin-top:6px}
.cashchip{background:var(--green);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
/* detail sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.on{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#sheet .pan{position:absolute;right:0;top:0;bottom:0;width:min(760px,100%);background:var(--bg);overflow:auto;padding:16px;box-shadow:-8px 0 30px rgba(0,0,0,.3)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.sec h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.sec h4 .n{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--mute);font-weight:600;white-space:nowrap}
.tw{overflow-x:auto}
.ad{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;background:var(--bg)}
.ad.own{border-color:var(--green)}
.ad .p{font-size:17px;font-weight:700}.ad .m{font-size:12px;color:var(--mute)}
.ad .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ad select{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--card);color:var(--ink);font-size:12px}
.src{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.hero{width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:12px;display:block;margin-bottom:10px}
.empty{padding:30px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:14px}
/* control room */
.cr input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.cr .big{font-size:22px;letter-spacing:.12em;font-weight:700;text-align:center;padding:12px;border:1.5px dashed var(--gold);border-radius:12px;background:var(--gold-bg);color:var(--gold);margin:8px 0}
.ok{color:var(--green)}.err{color:var(--red)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--brand);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:50;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:480px){.list{grid-template-columns:1fr}#sheet .pan{padding:12px}h1 small{display:none}}
</style>
</head>
<body>
<header><div class="wrap">
 <h1>Blacklist/Subsales Control Room<small data-i18n="title_sub"></small></h1>
 <div class="grow"></div>
 <button class="ic" id="lang" title="Bahasa / Language">EN</button>
 <button class="ic" id="theme" title="Light / Dark">◐</button>
 <button class="ic" id="lock" data-i18n="logout" hidden></button>
</div></header>

<main class="wrap">
 <section id="gate">
  <h2 data-i18n="gate_h"></h2>
  <p data-i18n="gate_p"></p>
  <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="BMV-XXXX-XXXX" data-i18n-al="gate_h">
  <button class="btn w" id="open" data-i18n="gate_btn"></button>
  <div id="gmsg" role="status"></div>
 </section>

 <section id="app" hidden>
  <div class="tabs" role="tablist">
   <button class="tab on" data-t="bld" role="tab" data-i18n="tab_bld"></button>
   <button class="tab" data-t="leads" role="tab" data-i18n="tab_leads"></button>
   <button class="tab" data-t="cr" role="tab" id="crTab" hidden>Control Room</button>
  </div>
  <div class="stats" id="stats"></div>

  <div id="vBld">
   <div class="filters" id="filters">
    <div class="full"><label for="q" data-i18n="f_q"></label><input id="q" data-i18n-ph="f_q_ph"></div>
    <div><label for="fState" data-i18n="f_state"></label><select id="fState"></select></div>
    <div><label for="fDist" data-i18n="f_dist"></label><select id="fDist"></select></div>
    <div><label for="fKind" data-i18n="f_kind"></label><select id="fKind"><option value="" data-i18n="all"></option><option>Apartment</option><option>Condominium</option><option>Serviced Apartment</option></select></div>
    <div><label for="fTen">Tenure</label><select id="fTen"><option value="" data-i18n="all"></option><option>Freehold</option><option>Leasehold</option></select></div>
    <div><label for="fLaca">LACA</label><select id="fLaca"><option value="" data-i18n="all"></option><option value="LACA" data-i18n="laca_has"></option><option value="Non-LACA" data-i18n="nonlaca_has"></option></select></div>
    <div><label for="fBank">Bank</label><select id="fBank"></select></div>
    <div><label for="fSeller" data-i18n="f_seller"></label><select id="fSeller"><option value="" data-i18n="all"></option><option value="owner">Direct owner</option><option value="agent" data-i18n="seller_agent"></option></select></div>
    <div><label for="fGap" data-i18n="f_gap"></label><input id="fGap" type="number" step="10000" value="0"></div>
    <div><label for="fCash" data-i18n="f_cash"></label><input id="fCash" type="number" step="10000" value="100000"></div>
    <div><label for="fYear" data-i18n="f_year"></label><input id="fYear" type="number" value="2020"></div>
    <div><label for="fSub">Subsales</label><select id="fSub"><option value="" data-i18n="sub_all"></option><option value="lead" data-i18n="sub_lead"></option><option value="any" data-i18n="sub_any"></option><option value="none" data-i18n="sub_none"></option></select></div>
    <div><label for="sort" data-i18n="f_sort"></label><select id="sort"><option value="gap" data-i18n="sort_gap"></option><option value="cash" data-i18n="sort_cash"></option><option value="mvn" data-i18n="sort_mvn"></option><option value="psf" data-i18n="sort_psf"></option><option value="cheap" data-i18n="sort_cheap"></option><option value="year" data-i18n="sort_year"></option><option value="name" data-i18n="sort_name"></option></select></div>
   </div>
   <div class="row" style="margin-bottom:10px"><span class="note" id="count"></span><div class="grow"></div><button class="btn s o" id="reset" data-i18n="reset"></button></div>
   <div class="list" id="list"></div>
  </div>

  <div id="vLeads" hidden>
   <p class="note" style="margin:0 0 10px" id="leadsIntro"></p>
   <div id="leads"></div>
  </div>

  <div id="vCr" hidden class="cr">
   <div class="sec">
    <h4 data-i18n="cr_cov"></h4>
    <div class="kv" id="crCov"></div>
    <p class="note" style="margin:8px 0 0" data-i18n-html="cr_next"></p>
   </div>
   <div class="sec">
    <h4><span data-i18n="cr_codes"></span> <span class="n" id="crN"></span></h4>
    <div class="tw"><table id="codes"><thead><tr><th data-i18n="th_label"></th><th data-i18n="th_for"></th><th data-i18n="th_exp"></th><th>Status</th><th></th></tr></thead><tbody></tbody></table></div>
   </div>
   <div class="sec">
    <h4 data-i18n="cr_new"></h4>
    <div class="row"><input id="nName" data-i18n-ph="n_name_ph" style="flex:1;min-width:160px"><input id="nDays" type="number" data-i18n-ph="n_days_ph" style="width:220px"><button class="btn s g" id="mk" data-i18n="mk"></button></div>
    <div id="newCode" hidden><div class="big" id="newCodeTxt"></div><p class="note" data-i18n="new_code_note"></p></div>
   </div>
   <div class="sec">
    <h4 data-i18n="cr_pub"></h4>
    <p class="note" style="margin:0 0 8px" data-i18n-html="cr_pub_note"></p>
    <div class="row"><input id="ghTok" type="password" placeholder="github_pat_…" style="flex:1;min-width:200px" autocomplete="off"><button class="btn s" id="pub" data-i18n="pub"></button><button class="btn s o" id="dl" data-i18n="dl"></button></div>
    <div class="note" id="pubMsg" style="margin-top:8px;min-height:18px"></div>
    <p class="note" id="pending" style="margin:6px 0 0"></p>
   </div>
  </div>
 </section>
</main>

<div id="sheet" aria-modal="true" role="dialog"><div class="bg" id="sheetBg"></div><div class="pan" id="pan"></div></div>
<div class="toast" id="toast"></div>

let ACCESS=null,DATA=null,KRAW=null,ARAW=null,ADMIN=false,ENTRY=null,CODE='';
async function derive(code){const n=norm(code);const cache=ls.get('bmv.kdk');
 if(cache&&cache.n===n&&cache.salt===ACCESS.kdf.salt&&cache.iter===ACCESS.kdf.iter)return b64(cache.bits);
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(n),'PBKDF2',false,['deriveBits']);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(ACCESS.kdf.salt),iterations:ACCESS.kdf.iter},base,256));
 ls.set('bmv.kdk',{n,salt:ACCESS.kdf.salt,iter:ACCESS.kdf.iter,bits:tob64(bits)});return bits}
async function idOf(bits){const tag=new Uint8Array([...bits,...new TextEncoder().encode('lelong-id')]);return hex(await crypto.subtle.digest('SHA-256',tag)).slice(0,32)}
async function unlock(code){
 if(!ACCESS){try{ACCESS=await fetch('access.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null)}catch(e){ACCESS=null}}
 if(!ACCESS)return {err:t('err_access')};
 const bits=await derive(code);const id=await idOf(bits);const e=ACCESS.codes[id];
 if(!e)return {err:t('err_invalid')};
 if(!e.wk||(e.exp&&new Date(e.exp)<new Date()))return {err:t('err_expired',{d:(e.exp||'').slice(0,10)})};
 try{const wk=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
  KRAW=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},wk,b64(e.wk));
  ARAW=null;if(e.admin&&e.wk2){try{ARAW=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv2)},wk,b64(e.wk2))}catch(x){ARAW=null}}
 }catch(x){return {err:t('err_invalid')}}
 ADMIN=!!(e.admin&&ARAW);ENTRY=e;CODE=code;return {ok:true}}
async function loadData(){
 const env=await fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json());
 if(env.kid!==ACCESS.kid){ACCESS=await fetch('access.json?v='+Date.now()+'r',{cache:'no-store'}).then(r=>r.json());const r=await unlock(CODE);if(r.err)throw new Error(r.err)}
 const key=await crypto.subtle.importKey('raw',KRAW,'AES-GCM',false,['decrypt']);
 DATA=JSON.parse(await gunzip(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(env.iv)},key,b64(env.ct))))}

$('#open').onclick=go;$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
async function go(){const c=$('#code').value.trim();if(norm(c).length<6){$('#gmsg').textContent=t('gate_full');return}
 $('#open').disabled=true;$('#gmsg').style.color='var(--mute)';$('#gmsg').textContent=t('gate_checking');
 const r=await unlock(c);$('#open').disabled=false;
 if(r.err){$('#gmsg').style.color='var(--red)';$('#gmsg').textContent=r.err;return}
 ls.set('bmv.code',c);await start()}
async function start(){try{await loadData()}catch(e){$('#gmsg').style.color='var(--red)';$('#gmsg').textContent=t('err_data')+e.message;return}
 $('#gate').hidden=true;$('#app').hidden=false;$('#lock').hidden=false;$('#crTab').hidden=!ADMIN;build()}

function filtered(){const q=$('#q').value.trim().toLowerCase(),st=$('#fState').value,di=$('#fDist').value,kd=$('#fKind').value,tn=$('#fTen').value,la=$('#fLaca').value,bk=$('#fBank').value,se=$('#fSeller').value,gp=+$('#fGap').value||0,cm=+$('#fCash').value||0,yr=+$('#fYear').value||9999,sb=$('#fSub').value;
 return B.filter(b=>{if(cm>0&&!b.sub.listings.some(l=>l.cashout90!=null&&l.cashout90>=cm))return false;if(st&&b.state!==st)return false;if(di&&b.district!==di)return false;if(kd&&b.kind!==kd)return false;if(tn&&b.tenure!==tn)return false;if(la&&!b.laca[la])return false;if(bk&&!b.banks.includes(bk))return false;if(ySort(b)>yr)return false;
  if(q&&!(b.name+' '+b.area+' '+(b.street||'')+' '+b.banks.join(' ')+' '+(b.district||'')).toLowerCase().includes(q))return false;

 if(!PENDING){$('#pubMsg').textContent=t('no_changes');return}
 const api=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${REPO.path}`;const h={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
 $('#pubMsg').textContent=t('publishing');$('#pub').disabled=true;
 try{const cur=await fetch(api+'?ref=main',{headers:h});if(!cur.ok)throw new Error(t('gh_err',{s:cur.status}));const sha=(await cur.json()).sha;
  const out={...PENDING,updated:new Date().toISOString().slice(0,10)};
  const body={message:t('commit_msg'),content:btoa(unescape(encodeURIComponent(JSON.stringify(out,null,1)))),sha,branch:'main'};
  const r=await fetch(api,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('GitHub '+r.status+': '+((await r.json()).message||''));
  ACCESS=out;PENDING=null;pend();codesTable();$('#pubMsg').innerHTML=t('pub_ok')}
 catch(e){$('#pubMsg').innerHTML='<span class="err">'+esc(e.message)+'</span>'+t('pub_fail_tail')}
 $('#pub').disabled=false}
</script>
</body>
